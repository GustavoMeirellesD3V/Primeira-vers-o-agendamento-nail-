<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · Área administrativa</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div class="login-wrap">
  <div class="login-card">
    <div class="login-card__logo">✦</div>
    <h1 class="login-card__titulo">Área administrativa</h1>
    <p class="login-card__legenda">Entre para gerenciar sua agenda.</p>

    <div class="login-card__erro" id="erro-login"></div>
    <div class="login-card__sucesso" id="sucesso-login"></div>

    <form id="form-login" novalidate>
      <div class="campo">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" autocomplete="username" placeholder="voce@studio.com" required>
      </div>
      <div class="campo">
        <label for="login-senha">Senha</label>
        <input type="password" id="login-senha" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn--primary btn--full" id="btn-entrar">Entrar</button>
    </form>

    <button type="button" class="login-card__esqueci" id="link-esqueci">Esqueci minha senha</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script>
  (async function () {
    if (await AuthService.isLoggedIn()) {
      window.location.href = 'admin/dashboard.html';
      return;
    }

    const form = document.getElementById('form-login');
    const erroBox = document.getElementById('erro-login');
    const sucessoBox = document.getElementById('sucesso-login');
    const btn = document.getElementById('btn-entrar');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      erroBox.classList.remove('login-card__erro--ativo');
      sucessoBox.classList.remove('login-card__sucesso--ativo');
      btn.disabled = true;
      btn.textContent = 'Entrando…';

      const email = document.getElementById('login-email').value;
      const senha = document.getElementById('login-senha').value;
      const resultado = await AuthService.login(email, senha);

      if (resultado.ok) {
        window.location.href = 'admin/dashboard.html';
      } else {
        erroBox.textContent = resultado.erro;
        erroBox.classList.add('login-card__erro--ativo');
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });

    document.getElementById('link-esqueci').addEventListener('click', async () => {
      const email = document.getElementById('login-email').value.trim();
      erroBox.classList.remove('login-card__erro--ativo');
      sucessoBox.classList.remove('login-card__sucesso--ativo');

      if (!email) {
        erroBox.textContent = 'Digite seu e-mail no campo acima e clique em "Esqueci minha senha" de novo.';
        erroBox.classList.add('login-card__erro--ativo');
        return;
      }

      const resultado = await AuthService.sendPasswordReset(email);
      if (resultado.ok) {
        sucessoBox.textContent = 'Se esse e-mail estiver cadastrado, você vai receber um link para redefinir a senha.';
        sucessoBox.classList.add('login-card__sucesso--ativo');
      } else {
        erroBox.textContent = 'Não foi possível enviar o e-mail agora. Tente novamente em instantes.';
        erroBox.classList.add('login-card__erro--ativo');
      }
    });
  })();
</script>
</body>
</html>
