<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Login — Área Administrativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

  <div class="login-screen">
    <div class="login-card">
      <div class="logo-badge" data-bind="logo" style="margin:0 auto 16px;">N</div>
      <h1>Área Administrativa</h1>
      <p class="subtitle" style="text-align:center;">Entre para gerenciar sua agenda</p>

      <div class="login-error" id="login-error">E-mail ou senha inválidos.</div>
      <div class="login-error" id="login-info" style="background:#E3F1E6;color:var(--color-success);">Enviamos um link de redefinição para o seu e-mail.</div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Entrar</button>
      </form>

      <div class="login-footer-link">
        <a href="#" id="forgot-link">Esqueci minha senha</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await window.NailTheme.applyTheme();

      // Se já estiver logada, vai direto pro dashboard
      const session = await DB.getSession();
      if (session) {
        window.location.href = 'admin/dashboard.html';
        return;
      }

      const form = document.getElementById('login-form');
      const errorBox = document.getElementById('login-error');
      const infoBox = document.getElementById('login-info');
      const submitBtn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.remove('show');
        infoBox.classList.remove('show');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Entrando...';
        try {
          await DB.login(form.email.value.trim(), form.password.value);
          window.location.href = 'admin/dashboard.html';
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.classList.add('show');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Entrar';
        }
      });

      document.getElementById('forgot-link').addEventListener('click', async (e) => {
        e.preventDefault();
        const email = form.email.value.trim();
        if (!email) {
          errorBox.textContent = 'Digite seu e-mail no campo acima primeiro.';
          errorBox.classList.add('show');
          return;
        }
        try {
          await DB.resetPassword(email);
          errorBox.classList.remove('show');
          infoBox.classList.add('show');
        } catch (err) {
          errorBox.textContent = 'Não foi possível enviar o e-mail de redefinição.';
          errorBox.classList.add('show');
        }
      });
    });
  </script>
</body>
</html>
