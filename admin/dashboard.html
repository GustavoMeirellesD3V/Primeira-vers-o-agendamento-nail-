<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard — Painel Administrativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    (async () => {
      const content = await Admin.buildShell({ title: "Dashboard", subtitle: "Visão geral do seu dia" });
      if (!content) return;

      const today = DB.todayISO();
      const [appointmentsToday, services, allAppointments] = await Promise.all([
        DB.getAppointments({ date: today }),
        DB.getServices(),
        DB.getAppointments({}),
      ]);

      const serviceMap = Object.fromEntries(services.map((s) => [s.id, s]));
      const activeToday = appointmentsToday.filter((a) => a.status !== "cancelado");
      const now = new Date();
      const nowMinutes = now.getHours() * 60 + now.getMinutes();
      const next = activeToday
        .filter((a) => {
          const [h, m] = a.horario.split(":").map(Number);
          return h * 60 + m >= nowMinutes;
        })
        .sort((a, b) => a.horario.localeCompare(b.horario))[0];

      const occupiedToday = activeToday.length;
      const faturamentoPrevisto = activeToday.reduce((sum, a) => sum + (serviceMap[a.serviceId]?.preco || 0), 0);
      const confirmedToday = activeToday.filter((a) => a.status === "confirmado" || a.status === "concluido").length;
      const confirmedPct = activeToday.length ? Math.round((confirmedToday / activeToday.length) * 100) : 0;

      const ICON_CALENDAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
      const ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>';
      const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
      const ICON_MONEY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>';
      const ICON_EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';

      content.innerHTML = `
        <div class="stat-grid">
          <div class="stat-card highlight">
            <div class="stat-top"><div class="ic">${ICON_CALENDAR}</div>${activeToday.length ? `<span class="stat-trend">${confirmedPct}% confirmados</span>` : ""}</div>
            <div class="value">${activeToday.length}</div>
            <div class="label">Agendamentos hoje</div>
          </div>
          <div class="stat-card">
            <div class="stat-top"><div class="ic">${ICON_CLOCK}</div></div>
            <div class="value">${next ? next.horario : "—"}</div>
            <div class="label">Próximo atendimento</div>
          </div>
          <div class="stat-card">
            <div class="stat-top"><div class="ic">${ICON_CHECK}</div></div>
            <div class="value">${occupiedToday}</div>
            <div class="label">Horários ocupados</div>
          </div>
          <div class="stat-card">
            <div class="stat-top"><div class="ic">${ICON_MONEY}</div></div>
            <div class="value">${Admin.formatCurrency(faturamentoPrevisto)}</div>
            <div class="label">Faturamento previsto</div>
          </div>
        </div>

        <div class="main-grid">
          <div class="panel">
            <div class="panel-header">
              <h2>Agenda de hoje</h2>
              <a href="agenda.html" class="btn btn-ghost btn-sm">Ver agenda completa →</a>
            </div>
            <div id="today-list"></div>
          </div>

          <div class="panel">
            <div class="panel-header"><h2>Status de hoje</h2></div>
            <div class="mini-donut" style="background:conic-gradient(var(--color-primary-dark) 0% ${confirmedPct}%, var(--color-primary-light) ${confirmedPct}% 100%);">
              <span>${confirmedPct}%</span>
            </div>
            <div class="legend-row"><span class="legend-dot" style="background:var(--color-primary-dark);"></span>Confirmados</div>
            <div class="legend-row"><span class="legend-dot" style="background:var(--color-primary-light);"></span>Pendentes / outros</div>
          </div>
        </div>
      `;

      const listEl = document.getElementById("today-list");
      if (!activeToday.length) {
        listEl.innerHTML = `<div class="empty-hint">Nenhum agendamento para hoje. 🎉</div>`;
      } else {
        listEl.innerHTML = activeToday
          .sort((a, b) => a.horario.localeCompare(b.horario))
          .map(
            (a) => `
          <div class="agenda-item">
            <div class="time">${a.horario}</div>
            <div class="bar"></div>
            <div class="info">
              <strong>${a.clienteNome}</strong>
              <span>${serviceMap[a.serviceId]?.nome || "Serviço removido"} · ${Admin.statusBadge(a.status)}</span>
            </div>
            <div class="actions">
              <a class="icon-btn" href="agendamentos.html?id=${a.id}" title="Ver detalhes">${ICON_EYE}</a>
            </div>
          </div>`
          )
          .join("");
      }
    })();
  </script>
</body>
</html>
